<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<!-- The API is a separate service on a separate origin. Override for local
     work with ?api=http://127.0.0.1:8000 -->
<meta name="turonomics-api" content="https://turonomics.onrender.com">
<title>Turonomics — Fleet</title>
<link rel="manifest" href="manifest.webmanifest">
<!-- iOS will not deliver a web push notification to a site opened in Safari;
     it only does so once the site has been added to the home screen, and it
     uses this icon rather than the manifest's when it is. -->
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0d0f12; --surface:#16191d; --surface2:#1d2126; --border:#2a2f36; --border2:#3a4048;
    --text:#f0f2f4; --muted:#98a1ab; --dim:#8a939d;
    --red:#ff6259; --amber:#f5a524; --green:#3ddc97; --blue:#5aa2f5;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  html,body{height:100%}
  body{
    font-family:"Archivo","Helvetica Neue",Helvetica,sans-serif;
    background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; overflow:hidden;
    padding-top:env(safe-area-inset-top,0px);
  }
  header{padding:14px 20px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  h1{font-size:24px;font-weight:700;letter-spacing:-.02em}
  .stamp{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
  .legend div{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%}
  #map{flex:1;min-height:0;background:#101317}
  .leaflet-container{background:#101317;font-family:inherit}
  .name[data-focus]{cursor:pointer}
  .name[data-focus]:hover{text-decoration:underline;text-underline-offset:3px}
  .chip{cursor:pointer}
  /* Off unless MAP_INVERT is set. When it is on, the filter goes on the tile
     pane alone so vehicle markers, the deadline ring and the controls keep
     their real colours — inverting the whole container would turn the red
     must-move marker cyan. */
  body.invert-tiles .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9) saturate(.75)}
  /* Leaflet's controls ship light and glare against a dark map. */
  .leaflet-control-attribution{
    background:rgba(13,15,18,.82)!important;color:var(--dim)!important;
    font-size:10px;padding:2px 6px;backdrop-filter:blur(4px)}
  .leaflet-control-attribution a{color:var(--muted)!important}
  .leaflet-control-attribution svg{display:none}
  .leaflet-bar a,.leaflet-touch .leaflet-bar a{
    background:var(--surface)!important;color:var(--text)!important;
    border-bottom-color:var(--border)!important;
    width:36px!important;height:36px!important;line-height:36px!important}
  .leaflet-bar a:hover,.leaflet-touch .leaflet-bar a:hover{background:var(--surface2)!important}
  .leaflet-bar{border:1px solid var(--border)!important;box-shadow:none!important}
  .pin{display:flex;align-items:center;justify-content:center;border-radius:50%;
       background:var(--bg);font-family:var(--mono);font-size:12px;font-weight:600;
       width:38px;height:38px;cursor:pointer;transition:transform .12s ease}
  .pin:hover{transform:scale(1.08)}
  .sheet{border-top:1px solid var(--border);background:var(--surface);
         padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));
         display:flex;flex-direction:column;gap:12px;flex-shrink:0;max-height:52vh;overflow-y:auto}
  .grab{width:34px;height:3px;border-radius:2px;background:var(--border2);align-self:center;flex-shrink:0}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{flex:1 1 0;min-width:64px;min-height:44px;display:flex;align-items:center;justify-content:center;
        border-radius:9px;font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.04em;
        border:1px solid var(--border);background:var(--surface2);cursor:pointer}
  .name{font-size:19px;font-weight:600;letter-spacing:-.01em}
  .plate{font-family:var(--mono);font-size:11px;color:var(--dim);
         background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:4px 7px}
  .where{font-size:13px;color:var(--muted);line-height:1.4}
  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .stat{display:flex;flex-direction:column;gap:4px;padding:10px 11px;background:var(--surface2);
        border:1px solid var(--border);border-radius:9px;min-width:0}
  .stat .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .stat .v{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:-.01em}
  .note{font-size:12.5px;line-height:1.45;padding:10px 12px;border-radius:9px}
  .ask{display:flex;flex-direction:column;gap:9px;padding:14px;border-radius:11px;
       background:var(--surface2);border:1px solid var(--border)}
  .ask h2{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;
          text-transform:uppercase;color:var(--amber,#f5a524);font-weight:600}
  .ask p{font-size:12.5px;color:var(--muted);line-height:1.45}
  .side{display:flex;align-items:center;gap:12px;min-height:56px;padding:11px 13px;
        border-radius:10px;background:var(--surface);border:1px solid var(--border2);
        cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit;
        transition:border-color .12s ease,background .12s ease}
  .side:hover{border-color:var(--green);background:#1b2a23}
  .side:active{background:#22332b}
  .side:disabled{opacity:.5;cursor:default}
  .side .s-name{font-size:15px;font-weight:600;letter-spacing:-.005em}
  .side .s-meta{font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-top:3px}
  .side .s-tag{font-size:11px;color:var(--green);margin-top:3px}
  .muted{color:var(--muted)}
  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
  .err{margin:12px 20px;padding:12px 14px;border-radius:9px;background:#1a1214;
       border:1px solid #4a2a29;color:var(--red);font-size:13px;line-height:1.45}
  .where-btn{align-self:flex-start;font:inherit;font-size:12px;font-weight:600;color:var(--green);
       background:none;border:1px solid #2b4a3c;border-radius:8px;padding:7px 12px;cursor:pointer}
  .where-btn:hover{background:#15241d}
  .where-btn:disabled{opacity:.5;cursor:default}
  .spots{display:flex;flex-direction:column;gap:7px}
  .spots h2{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;
       text-transform:uppercase;color:var(--green);font-weight:600;padding:2px}
  .spots .caveat{font-size:11.5px;color:var(--dim);line-height:1.45;padding:0 2px}
  .spot{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;
        background:var(--surface);border:1px solid var(--border2)}
  .spot .s-name{font-size:14.5px;font-weight:600;letter-spacing:-.005em}
  .spot .s-free{font-family:var(--mono);font-size:11.5px;color:var(--green);margin-top:3px}
  .spot .s-far{font-family:var(--mono);font-size:11px;color:var(--dim);flex-shrink:0}
  .tasks{display:flex;flex-direction:column;gap:7px}
  .task{display:flex;align-items:flex-start;gap:11px;padding:11px 12px;border-radius:10px;
        background:var(--surface2);border:1px solid var(--border);text-align:left;
        width:100%;font:inherit;color:inherit;cursor:pointer;
        transition:border-color .12s ease,opacity .15s ease}
  .task:hover{border-color:var(--green)}
  .task:disabled{opacity:.45;cursor:default}
  .task .box{width:20px;height:20px;border-radius:6px;border:1.6px solid var(--border2);
        flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center}
  .task:hover .box{border-color:var(--green)}
  .task .t-title{font-size:14.5px;font-weight:600;letter-spacing:-.005em}
  .task .t-meta{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:3px}
  .task .t-due{font-weight:600}
  .task.overdue .t-due{color:var(--red)}
  .task.soon .t-due{color:var(--amber)}
  .undo{align-self:flex-start;font:inherit;font-size:11.5px;color:var(--muted);
        background:none;border:none;padding:4px 0;cursor:pointer;text-decoration:underline;
        text-underline-offset:3px}
  .note-guest{display:flex;flex-direction:column;gap:7px;padding:11px 13px;border-radius:10px;
       background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--blue)}
  .note-guest .g-who{font-family:var(--mono);font-size:10px;letter-spacing:.09em;
       text-transform:uppercase;color:var(--dim)}
  .note-guest .g-body{font-size:13.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .notes{display:flex;flex-direction:column;gap:8px}
  .bell{font:inherit;font-size:11.5px;color:var(--muted);cursor:pointer;
        display:flex;align-items:center;gap:6px;min-height:32px;padding:5px 10px;
        border-radius:8px;border:1px solid var(--border);background:var(--surface2)}
  .bell:hover{border-color:var(--border2);color:var(--text)}
  .bell[data-state="on"]{color:var(--green);border-color:#2b4a3c}
  .bell:disabled{opacity:.55;cursor:default}
  @media(min-width:900px){.sheet{max-height:40vh}}
</style>
</head>
<body>
  <header>
    <div class="row">
      <h1>Fleet</h1>
      <div class="row" style="gap:10px">
        <button type="button" class="bell" id="alerts" hidden></button>
        <div class="stamp" id="stamp">loading…</div>
      </div>
    </div>
    <div class="legend">
      <div><span class="dot" style="background:var(--red)"></span>Move soon</div>
      <div><span class="dot" style="background:var(--amber)"></span>Needs prep</div>
      <div><span class="dot" style="background:var(--blue)"></span>On trip</div>
      <div><span class="dot" style="background:var(--green)"></span>Clear</div>
      <div><span class="dot" style="background:var(--dim)"></span>No tracker</div>
    </div>
  </header>

  <div id="err" class="err" hidden></div>
  <div id="map"></div>

  <div class="sheet" id="sheet">
    <div class="grab"></div>
    <div id="sheet-body" class="empty">Loading fleet…</div>
  </div>

<script src="vendor/leaflet.js"></script>
<script>
(function () {
  "use strict";

  var COLORS = { red: "#ff6259", amber: "#f5a524", green: "#3ddc97", blue: "#5aa2f5", dim: "#8a939d" };

  // The UI is a static site and the API is a separate service, so the base URL
  // is configuration rather than an assumption. A ?api= override keeps local
  // development from needing a rebuild or a proxy.
  var API = (function () {
    var override = new URLSearchParams(location.search).get("api");
    if (override) return override.replace(/\/$/, "");
    var meta = document.querySelector('meta[name="turonomics-api"]');
    return (meta && meta.content ? meta.content : "").replace(/\/$/, "");
  })();
  var map, markers = {}, fleet = null, selectedId = null, tilesAdded = false;
  var pendingCar = new URLSearchParams(location.search).get("car");
  // The task just ticked off, so an undo is offered for exactly as long as the
  // card stays put. Not persisted: a mis-tap is noticed immediately or not at
  // all, and a stale "undo" on tomorrow's screen is just confusing.
  var lastDone = null;

  function initials(name) {
    var parts = String(name || "?").trim().split(/[\s·—-]+/).filter(Boolean);
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[1][0]).toUpperCase();
  }

  // Colour is driven by the soonest thing that could go wrong, so the map reads
  // as a priority ordering rather than a set of statuses.
  function tone(v) {
    if (!v.has_tracker) return "dim";
    if (v.on_trip_with) return "blue";
    var due = v.parking && v.parking.must_move_by;
    if (due) {
      var hours = (new Date(due) - new Date()) / 3.6e6;
      if (hours < 2) return "red";
      if (hours < 12) return "amber";
    }
    if (v.fuel_percent != null && v.fuel_percent < 20) return "amber";
    return "green";
  }

  // Anything beyond this is treated as away rather than as part of the
  // operating area. Generous enough to cover a neighbouring borough.
  var LOCAL_RADIUS_KM = 25;

  function distanceKm(a, b) {
    var R = 6371, toRad = Math.PI / 180;
    var dLat = (b.lat - a.lat) * toRad, dLon = (b.lon - a.lon) * toRad;
    var lat1 = a.lat * toRad, lat2 = b.lat * toRad;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.sin(dLon / 2) * Math.sin(dLon / 2) * Math.cos(lat1) * Math.cos(lat2);
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  function median(xs) {
    var s = xs.slice().sort(function (a, b) { return a - b; });
    var m = Math.floor(s.length / 2);
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }

  // A vehicle is "home" when its parking spot has candidate street segments —
  // that is, when we hold cleaning rules for where it sits. That is a better
  // definition of the operating area than anything geometric: a midpoint
  // between Brooklyn and upstate is a field in the Hudson Valley, and anchoring
  // on it frames neither.
  function isHome(v) {
    return !!(v.position && v.parking && v.parking.options && v.parking.options.length);
  }

  function fleetCentre(located) {
    var home = located.filter(isHome);
    var basis = home.length ? home : located;
    return {
      lat: median(basis.map(function (v) { return v.position.lat; })),
      lon: median(basis.map(function (v) { return v.position.lon; })),
    };
  }

  function nearbyGroup(located) {
    if (located.length < 2) return located;
    var c = fleetCentre(located);
    var near = located.filter(function (v) {
      return distanceKm(c, v.position) <= LOCAL_RADIUS_KM;
    });
    return near.length ? near : located;
  }

  function awayKm(v, located) {
    if (!v.position || located.length < 2) return null;
    var d = distanceKm(fleetCentre(located), v.position);
    return d > LOCAL_RADIUS_KM ? d : null;
  }

  function relative(iso) {
    if (!iso) return "—";
    var mins = Math.round((new Date() - new Date(iso)) / 6e4);
    if (mins < 2) return "just now";
    if (mins < 60) return mins + " min ago";
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + "h ago";
    return Math.round(hrs / 24) + "d ago";
  }

  function until(iso) {
    if (!iso) return null;
    var when = new Date(iso);
    var mins = Math.round((when - new Date()) / 6e4);
    if (mins < 0) return "overdue";
    // A countdown is what you want when it is close. Further out, the day and
    // time is what you actually plan around — "in 3d" does not tell you
    // whether that is before or after Monday morning.
    if (mins < 60) return "in " + mins + " min";
    var hrs = Math.floor(mins / 60);
    if (hrs < 24) return "in " + hrs + "h " + (mins % 60) + "m";
    // The fleet's zone, not the device's. A sign says 11:30am in Brooklyn
    // regardless of where the phone thinks it is, and rendering a
    // street-cleaning deadline an hour out is how a ticket happens.
    return when.toLocaleString(undefined, {
      weekday: "short", hour: "numeric", minute: "2-digit",
      timeZone: (fleet && fleet.fleet_timezone) || undefined,
    });
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function pinIcon(v) {
    var c = COLORS[tone(v)];
    var ring = v.id === selectedId ? 3 : 2;
    return L.divIcon({
      className: "",
      html: '<div class="pin" style="border:' + ring + 'px solid ' + c + ';color:' + c + '">' +
            esc(initials(v.nickname)) + "</div>",
      iconSize: [38, 38], iconAnchor: [19, 19],
    });
  }

  function render() {
    if (!fleet) return;
    document.getElementById("stamp").textContent =
      fleet.vehicles.length + " vehicles" +
      (fleet.untracked_count ? " · " + fleet.untracked_count + " untracked" : "");

    var located = fleet.vehicles.filter(function (v) { return v.position; });

    if (!map) { renderSheet(); return; }

    Object.keys(markers).forEach(function (id) { map.removeLayer(markers[id]); });
    markers = {};

    located.forEach(function (v) {
      var m = L.marker([v.position.lat, v.position.lon], { icon: pinIcon(v) }).addTo(map);
      m.on("click", function () { selectedId = v.id; render(); });
      markers[v.id] = m;
    });

    if (located.length && !map._fitted) {
      // Frame the operating area, not every vehicle. A car out on a trip can be
      // a hundred miles away, and fitting to it shrinks the four blocks that
      // actually need managing down to a dot. Vehicles outside the cluster
      // still get pins — they are just not allowed to set the view.
      var near = nearbyGroup(located);
      map.fitBounds(near.map(function (v) { return [v.position.lat, v.position.lon]; }), {
        // Extra bottom padding: the sheet and the attribution bar overlap the
        // map, and a pin behind them is a pin you cannot tap.
        paddingTopLeft: [50, 50],
        paddingBottomRight: [50, 130],
        maxZoom: 16,
      });
      map._fitted = true;
    }

    renderSheet();
  }


  // Selecting a car moves the map to it. The fleet is spread across three
  // states on a bad week, so "which one am I looking at" is a real question —
  // and panning there is cheaper than reading coordinates off the sheet.
  function focusVehicle(id) {
    selectedId = id;
    render();
    if (!map) return;
    var v = (fleet.vehicles.filter(function (x) { return x.id === id; })[0]) || null;
    if (!v || !v.position) return;
    // Zoom in if we are further out than street level, but never zoom *out* —
    // someone who has deliberately zoomed to a block should keep that.
    var zoom = Math.max(map.getZoom(), 16);
    map.flyTo([v.position.lat, v.position.lon], zoom, { duration: 0.6 });
    // The one-time auto-fit must not undo a deliberate move.
    map._fitted = true;
  }

  function renderSheet() {
    var body = document.getElementById("sheet-body");
    if (!fleet.vehicles.length) {
      body.className = "empty";
      body.innerHTML = "No vehicles yet.<br>Run <code>python -m turonomics_api.cli sync --create-missing</code>.";
      return;
    }
    if (!selectedId) selectedId = fleet.vehicles[0].id;
    var v = fleet.vehicles.filter(function (x) { return x.id === selectedId; })[0] || fleet.vehicles[0];
    var c = COLORS[tone(v)];

    var chips = fleet.vehicles.map(function (x) {
      var xc = COLORS[tone(x)], on = x.id === v.id;
      return '<div class="chip" data-id="' + x.id + '" style="color:' + (on ? "#0d0f12" : xc) +
             ";background:" + (on ? xc : "var(--surface2)") + ";border-color:" + (on ? xc : "var(--border)") + '">' +
             esc(initials(x.nickname)) + "</div>";
    }).join("");

    var where;
    if (v.on_trip_with) {
      where = "On trip with " + esc(v.on_trip_with) +
              (v.trip_ends_at ? " · back " + new Date(v.trip_ends_at).toLocaleString(undefined,
                { weekday: "short", hour: "numeric", minute: "2-digit",
                  timeZone: (fleet && fleet.fleet_timezone) || undefined }) : "");
    } else if (v.parking && v.parking.confirmed) {
      where = esc(v.parking.street_name) + " — " + esc(v.parking.confirmed_side) + " side · parked " +
              relative(v.parking.since);
    } else if (v.parking && v.parking.options && v.parking.options.length) {
      where = "Parked " + relative(v.parking.since) + " · side not confirmed";
    } else if (v.parking) {
      // Parked, but nowhere we hold rules for. Saying "side not confirmed"
      // here would imply there is something to confirm.
      var far = awayKm(v, fleet.vehicles.filter(function (x) { return x.position; }));
      where = "Parked " + relative(v.parking.since) +
              (far ? " · " + Math.round(far * 0.621) + " mi from your blocks" : " · no cleaning rules here");
    } else if (v.position) {
      var km = awayKm(v, fleet.vehicles.filter(function (x) { return x.position; }));
      where = km
        ? Math.round(km * 0.621) + " mi from your blocks · last seen " + relative(v.position.reported_at)
        : "Last seen " + relative(v.position.reported_at);
    } else {
      where = v.has_tracker ? "No position reported yet" : "No tracker — location must be set by hand";
    }

    var moveBy = v.parking && v.parking.must_move_by;
    var stats =
      // "unknown" only where there is something to find out. A car parked
      // outside the rule coverage has no deadline to be uncertain about.
      stat("Must move",
           moveBy ? until(moveBy)
                  : (v.parking && !v.parking.confirmed && v.parking.options &&
                     v.parking.options.length ? "unknown" : "—"),
           moveBy ? c : "var(--dim)") +
      stat("Fuel", v.fuel_percent != null ? Math.round(v.fuel_percent) + "%" : "—",
           v.fuel_percent != null && v.fuel_percent < 20 ? COLORS.amber : "var(--text)") +
      stat("Odometer", v.odometer_miles != null ? Math.round(v.odometer_miles).toLocaleString() : "—",
           "var(--text)");

    var note = "";
    if (v.on_trip_with) {
      note = noteHtml(COLORS.blue, "On trip — parking clock suppressed until return.");
    } else if (v.parking && !v.parking.confirmed &&
               v.parking.options && v.parking.options.length) {
      // Distances, not a score. A number derived from the gap between two
      // measurements looks calibrated without being so, and the operator reads
      // "0.4 m vs 5.9 m" better than any formula can summarise it.
      note =
        '<div class="ask"><h2>Which side?</h2>' +
        "<p>The two sides have different rules, so there is no deadline until you say.</p>" +
        v.parking.options.map(function (o) {
          var tag = o.from_memory ? "you chose this here before"
                  : o.is_guess ? "closest to the reported position" : "";
          return '<button class="side" data-side="' + esc(o.id) +
                 '" data-session="' + esc(v.parking.session_id) + '">' +
                 '<div style="flex-grow:1;min-width:0">' +
                   '<div class="s-name">' + esc(o.street_name) + " " + esc(o.side) + "</div>" +
                   '<div class="s-meta">' + o.distance_m + " m away</div>" +
                   (tag ? '<div class="s-tag">' + tag + "</div>" : "") +
                 "</div>" +
                 '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
                 'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ' +
                 'style="color:var(--dim);flex-shrink:0"><polyline points="9 18 15 12 9 6"/></svg>' +
                 "</button>";
        }).join("") +
        "</div>";
    } else if (v.parking && !v.parking.confirmed) {
      note = noteHtml(COLORS.dim,
        "No street-cleaning rules loaded for where this car is, so there is no parking " +
        "clock for it. Nothing to confirm.");
    } else if (!v.has_tracker) {
      note = noteHtml(COLORS.dim, "No tracker on this vehicle yet, so nothing here updates on its own.");
    }

    body.className = "";
    body.innerHTML =
      '<div class="chips">' + chips + "</div>" +
      '<div class="row" style="align-items:flex-start">' +
        '<div style="display:flex;flex-direction:column;gap:4px;min-width:0">' +
          '<div class="name"' + (v.position ? ' data-focus="' + v.id + '" title="Centre the map here"' : "") +
            ">" + esc(v.nickname) + "</div>" +
          '<div class="where">' + where + "</div>" +
        "</div>" +
        (v.plate ? '<div class="plate">' + esc(v.plate) + "</div>" : "") +
      "</div>" +
      '<div class="stats">' + stats + "</div>" +
      tasksHtml(v) +
      (hasMoveTask(v) && !spotsFor[v.id]
        ? '<button class="where-btn" data-spots="' + esc(v.id) + '">Where to?</button>'
        : "") +
      spotsHtml(v) +
      (lastDone ? '<button class="undo" data-undo="' + esc(lastDone) + '">Undo that</button>' : "") +
      guestNotesHtml(v) + note;

    Array.prototype.forEach.call(body.querySelectorAll(".chip"), function (el) {
      el.addEventListener("click", function () { focusVehicle(el.dataset.id); });
    });

    Array.prototype.forEach.call(body.querySelectorAll("[data-spots]"), function (el) {
      el.addEventListener("click", function () {
        var target = fleet.vehicles.filter(function (x) { return x.id === el.dataset.spots; })[0];
        if (target) loadSpots(target, el);
      });
    });

    Array.prototype.forEach.call(body.querySelectorAll("[data-task]"), function (el) {
      el.addEventListener("click", function () { taskAction(el.dataset.task, "done", el); });
    });

    Array.prototype.forEach.call(body.querySelectorAll("[data-undo]"), function (el) {
      el.addEventListener("click", function () { taskAction(el.dataset.undo, "undo", el); });
    });

    Array.prototype.forEach.call(body.querySelectorAll("[data-focus]"), function (el) {
      el.addEventListener("click", function () { focusVehicle(el.dataset.focus); });
    });

    Array.prototype.forEach.call(body.querySelectorAll(".side"), function (el) {
      el.addEventListener("click", function () {
        confirmSide(el.dataset.session, el.dataset.side, body);
      });
    });
  }

  // Where to put it. The deadline is the easy half; the operator's actual
  // problem at 8am is which block is not swept tomorrow.
  //
  // Fetched on demand rather than with the fleet, because it is a spatial
  // query per car and it is only wanted at the moment somebody is about to
  // drive one somewhere.
  var spotsFor = {};

  function spotsHtml(v) {
    var found = spotsFor[v.id];
    if (!found) return "";
    if (!found.length) {
      return '<div class="spots"><h2>Where to move it</h2><div class="caveat">' +
             "No block within walking distance " +
             "has street-cleaning rules on file, so there is nothing to recommend. " +
             "That is missing data, not an empty street.</div></div>";
    }
    return '<div class="spots"><h2>Where to move it</h2>' + found.map(function (s) {
      // until() returns three shapes — "in 45 min", "in 3h 20m", and
      // "Thu 10:06 AM" — so the prefix has to read correctly in front of all
      // of them. "next swept" does; "clear until … from now" produced
      // "clear until Thu 10:06 AM from now".
      var free = s.next_cleaning
        ? "next swept " + esc(until(s.next_cleaning))
        : "no cleaning on file for this block";
      return '<div class="spot">' +
               '<div style="flex-grow:1;min-width:0">' +
                 '<div class="s-name">' + esc(s.street_name) + " " + esc(s.side) + "</div>" +
                 '<div class="s-free">' + free + "</div>" +
               "</div>" +
               '<div class="s-far">' + Math.round(s.distance_m) + " m</div>" +
             "</div>";
    }).join("") +
    // Said every time, not once. The app knows the sweeping schedule and
    // nothing whatsoever about whether there is room at the kerb, and a list
    // that looks like parking advice will be read as parking advice.
    '<div class="caveat">Ranked by how long each block stays clear. ' +
    "Whether there is actually a space is not something this can see.</div></div>";
  }

  function loadSpots(v, el) {
    el.disabled = true;
    el.textContent = "Looking\u2026";
    fetch(API + "/api/vehicles/" + encodeURIComponent(v.id) + "/spots")
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (body) {
        spotsFor[v.id] = body.spots || [];
        render();
      })
      .catch(function (e) {
        el.disabled = false;
        el.textContent = "Where to?";
        var err = document.getElementById("err");
        err.hidden = false;
        err.textContent = "Could not look for spots: " + e.message;
      });
  }

  // The run sheet's actual job: what has to happen to this car. Every module
  // in the app emits Tasks and nothing else reaches here, so until now the
  // whole abstraction's output was a number nobody rendered.
  function tasksHtml(v) {
    var tasks = v.tasks || [];
    if (!tasks.length) return "";
    return '<div class="tasks">' + tasks.map(function (t) {
      var cls = "task", due = "";
      if (t.due_by) {
        var ms = new Date(t.due_by) - new Date();
        cls += ms < 0 ? " overdue" : (ms < 3 * 3600 * 1000 ? " soon" : "");
        due = '<span class="t-due">' + esc(until(t.due_by)) + "</span>";
      }
      var meta = [due, t.location_label ? esc(t.location_label) : "", t.detail ? esc(t.detail) : ""]
        .filter(Boolean).join(" · ");
      return '<button class="' + cls + '" data-task="' + esc(t.id) + '">' +
               '<div class="box"></div>' +
               '<div style="flex-grow:1;min-width:0">' +
                 '<div class="t-title">' + esc(t.title) + "</div>" +
                 (meta ? '<div class="t-meta">' + meta + "</div>" : "") +
               "</div>" +
             "</button>";
    }).join("") + "</div>";
  }

  // Posting from the card and re-rendering from the response, rather than
  // waiting for the sixty-second refresh: a tick that does nothing visible for
  // a minute reads as a tick that did not work, and gets tapped again.
  function taskAction(id, action, el) {
    el.disabled = true;
    fetch(API + "/api/tasks/" + encodeURIComponent(id) + "/" + action, { method: "POST" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (updated) {
        fleet.vehicles = fleet.vehicles.map(function (x) {
          return x.id === updated.id ? updated : x;
        });
        lastDone = action === "done" ? id : null;
        render();
      })
      .catch(function (e) {
        el.disabled = false;
        var err = document.getElementById("err");
        err.hidden = false;
        err.textContent = "Could not update that task: " + e.message;
      });
  }

  // What the guest actually wrote, above the question it usually answers.
  // Deliberately verbatim and not summarised: the operator is deciding which
  // side of a street a car is on, and a paraphrase of "I left it across from
  // the school" is worth nothing.
  function guestNotesHtml(v) {
    var notes = v.guest_notes || [];
    if (!notes.length) return "";
    return '<div class="notes">' + notes.map(function (n) {
      var who = (n.guest_name ? esc(n.guest_name) : "Guest") + " \u00b7 " + esc(relative(n.received_at));
      return '<div class="note-guest">' +
               '<div class="g-who">' + who + "</div>" +
               '<div class="g-body">' + esc(n.body) + "</div>" +
             "</div>";
    }).join("") + "</div>";
  }

  function hasMoveTask(v) {
    return (v.tasks || []).some(function (t) { return t.kind === "asp_move"; });
  }

  function stat(k, val, colour) {
    return '<div class="stat"><div class="k">' + esc(k) + '</div>' +
           '<div class="v" style="color:' + colour + '">' + esc(val) + "</div></div>";
  }

  function noteHtml(colour, text) {
    return '<div class="note" style="color:' + colour + ";background:" + colour +
           "14;border:1px solid " + colour + '2e">' + esc(text) + "</div>";
  }

  function confirmSide(sessionId, segmentSideId, body) {
    // One answer at a time: a second tap while the first is in flight would
    // race, and the one that lands last would win rather than the one meant.
    Array.prototype.forEach.call(body.querySelectorAll(".side"), function (el) {
      el.disabled = true;
    });

    fetch(API + "/api/parking/" + encodeURIComponent(sessionId) + "/confirm", {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify({ segment_side_id: segmentSideId }),
    })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function () {
        // Reload rather than patching in place: confirming produces a deadline
        // and a task, and the server is the one that knows what they are.
        load();
      })
      .catch(function (e) {
        Array.prototype.forEach.call(body.querySelectorAll(".side"), function (el) {
          el.disabled = false;
        });
        var el = document.getElementById("err");
        el.hidden = false;
        el.textContent = "Could not save that: " + e.message + " — nothing was changed.";
      });
  }

  function load() {
    fetch(API + "/api/fleet", { headers: { Accept: "application/json" } })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (data) {
        document.getElementById("err").hidden = true;
        fleet = data;
        addTiles(data.map_tiles);
        render();
        // A notification names the car it is about. Applied once, after the
        // first load that knows about it, and then forgotten — re-centring on
        // every sixty-second refresh would fight the operator for the map.
        if (pendingCar) {
          var known = fleet.vehicles.some(function (v) { return v.id === pendingCar; });
          if (known) focusVehicle(pendingCar);
          pendingCar = null;
        }
      })
      .catch(function (e) {
        var el = document.getElementById("err");
        el.hidden = false;
        el.textContent = "Could not reach the API at " + (API || location.origin) + " — " + e.message;
      });
  }

  // ---- Alerts ------------------------------------------------------------
  // Web push, so a street-cleaning deadline reaches the operator with the tab
  // closed. The button is the whole UI: a browser will only grant notification
  // permission in response to a gesture, so there is no enabling this quietly.

  var swReg = null;

  function urlB64ToUint8(value) {
    var padded = value.replace(/-/g, "+").replace(/_/g, "/");
    while (padded.length % 4) padded += "=";
    var raw = atob(padded);
    var out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i += 1) out[i] = raw.charCodeAt(i);
    return out;
  }

  function pushSupported() {
    return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  }

  function installedToHomeScreen() {
    return window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  }

  function isApple() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }

  function setBell(state, label, disabled) {
    var btn = document.getElementById("alerts");
    btn.hidden = false;
    btn.dataset.state = state;
    btn.disabled = !!disabled;
    btn.textContent = (state === "on" ? "\u25cf " : "\u25cb ") + label;
  }

  function initAlerts() {
    if (!pushSupported()) {
      // iOS delivers web push only to a site added to the home screen, and
      // hides PushManager everywhere else — so on an iPhone this is not a
      // broken browser, it is a missing step, and saying which one is the
      // difference between the feature working and the operator giving up.
      if (isApple() && !installedToHomeScreen()) {
        setBell("info", "Share \u2192 Add to Home Screen for alerts", true);
      }
      return;
    }
    setBell("off", "Checking\u2026", true);
    navigator.serviceWorker.register("sw.js")
      .then(function (reg) {
        swReg = reg;
        return reg.pushManager.getSubscription();
      })
      .then(function (sub) {
        if (sub) { setBell("on", "Alerts on", false); return; }
        setBell("off", Notification.permission === "denied" ? "Alerts blocked" : "Enable alerts",
                Notification.permission === "denied");
      })
      .catch(function (e) {
        setBell("off", "Alerts unavailable", true);
        console.warn("service worker registration failed", e);
      });
    document.getElementById("alerts").addEventListener("click", toggleAlerts);
  }

  function toggleAlerts() {
    if (document.getElementById("alerts").dataset.state === "on") return disableAlerts();
    setBell("off", "Enabling\u2026", true);
    Notification.requestPermission()
      .then(function (permission) {
        if (permission !== "granted") {
          setBell("off", permission === "denied" ? "Alerts blocked" : "Enable alerts",
                  permission === "denied");
          return null;
        }
        return fetch(API + "/api/push/key").then(function (r) { return r.json(); });
      })
      .then(function (cfg) {
        if (!cfg) return null;
        if (!cfg.configured) {
          // The server has no VAPID key. Said plainly rather than left as a
          // button that does nothing: this is a thing to go and configure.
          setBell("off", "Alerts not set up on the server", true);
          return null;
        }
        return swReg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlB64ToUint8(cfg.public_key)
        });
      })
      .then(function (sub) {
        if (!sub) return null;
        return fetch(API + "/api/push/subscribe", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(sub.toJSON())
        }).then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          setBell("on", "Alerts on", false);
        });
      })
      .catch(function (e) {
        setBell("off", "Enable alerts", false);
        var el = document.getElementById("err");
        el.hidden = false;
        el.textContent = "Could not enable alerts — " + e.message;
      });
  }

  function disableAlerts() {
    setBell("on", "Turning off\u2026", true);
    swReg.pushManager.getSubscription()
      .then(function (sub) {
        if (!sub) return null;
        // Told to the server first. Unsubscribing locally first and then
        // failing to reach the API would leave a row that can never be
        // delivered to and nothing to delete it by.
        return fetch(API + "/api/push/unsubscribe", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(sub.toJSON())
        }).then(function () { return sub.unsubscribe(); });
      })
      .then(function () { setBell("off", "Enable alerts", false); })
      .catch(function () { setBell("on", "Alerts on", false); });
  }

  // Data first. The fleet list must render whether or not the map library
  // loaded, so a blocked script or a dead tile server costs you the map, not
  // the answer to "where are my cars".
  load();

  try {
    if (typeof L === "undefined") throw new Error("map library unavailable");
    map = L.map("map", { zoomControl: false, attributionControl: true })
           .setView([40.6795, -73.9705], 15);
    L.control.zoom({ position: "bottomright" }).addTo(map);
    // The basemap is chosen by the API, not hard-coded here: Thunderforest
    // when a key is configured, OpenStreetMap otherwise. The key is public by
    // necessity — any browser map key is — so serving it keeps it in one place
    // rather than committed to this file.
    //
    // Added once the first fleet response arrives, in addTiles() below.
  } catch (e) {
    map = null;
    var el = document.getElementById("map");
    el.style.display = "flex";
    el.style.alignItems = "center";
    el.style.justifyContent = "center";
    el.style.padding = "24px";
    el.style.textAlign = "center";
    el.style.color = "var(--dim)";
    el.style.fontSize = "13px";
    el.textContent = "Map unavailable offline — positions are listed below.";
    if (fleet) render();
  }
  // A lapsed or wrong key is the failure worth designing for. Thunderforest
  // answers an invalid key with 401 rather than a plausible-looking tile, so
  // unlike Carto it is detectable — and the honest response to a basemap that
  // will not load is to fall back to one that will, and say so, rather than
  // leave the operator looking at an empty grey rectangle wondering whether
  // their cars are missing or the map is.
  function addTiles(cfg) {
    if (!map || tilesAdded) return;
    tilesAdded = true;
    document.body.classList.toggle("invert-tiles", !!(cfg && cfg.invert));
    var url = (cfg && cfg.url) || "https://tile.openstreetmap.org/{z}/{x}/{y}.png";
    var layer = L.tileLayer(url, {
      attribution: (cfg && cfg.attribution) || "&copy; OpenStreetMap contributors",
      maxZoom: (cfg && cfg.max_zoom) || 19,
    });
    var failures = 0;
    layer.on("tileerror", function () {
      failures += 1;
      // One failure is a dropped request; several is the provider refusing.
      if (failures !== 4 || url.indexOf("openstreetmap.org") !== -1) return;
      map.removeLayer(layer);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors — basemap key rejected",
        maxZoom: 19,
      }).addTo(map);
    });
    layer.addTo(map);
  }

  initAlerts();

  // Telemetry only changes when a car moves, so this is a gentle refresh, not a poll.
  setInterval(load, 60000);
})();
</script>
</body>
</html>
