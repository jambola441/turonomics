<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<meta name="turonomics-api" content="https://turonomics.onrender.com">
<title>Turonomics — Invoices</title>
<link rel="apple-touch-icon" href="../fleet/icons/icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0d0f12; --surface:#16191d; --surface2:#1d2126; --border:#2a2f36; --border2:#3a4048;
    --text:#f0f2f4; --muted:#98a1ab; --dim:#8a939d;
    --red:#ff6259; --amber:#f5a524; --green:#3ddc97; --blue:#5aa2f5;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  body{
    font-family:"Archivo","Helvetica Neue",Helvetica,sans-serif;
    background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));
  }
  main{max-width:820px;margin:0 auto;padding:0 16px}
  header{padding:16px 0 14px;border-bottom:1px solid var(--border);margin-bottom:16px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  h1{font-size:24px;font-weight:700;letter-spacing:-.02em}
  .stamp{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .nav{display:flex;gap:7px}
  .nav a{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
       color:var(--muted);text-decoration:none;border:1px solid var(--border);
       border-radius:7px;padding:7px 10px}
  .nav a:hover{border-color:var(--border2);color:var(--text)}

  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:18px}
  .stat{display:flex;flex-direction:column;gap:5px;padding:12px;background:var(--surface2);
        border:1px solid var(--border);border-radius:10px;min-width:0}
  .stat .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
           text-transform:uppercase;color:var(--dim)}
  .stat .v{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.02em}
  .stat .n{font-size:11px;color:var(--dim);line-height:1.35}
  .stat.urgent .v{color:var(--amber)}
  .stat.gone .v{color:var(--red)}

  h2{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
     color:var(--muted);font-weight:600;margin:22px 0 9px}
  h2.urgent{color:var(--amber)}
  h2.gone{color:var(--red)}
  .lede{font-size:12.5px;color:var(--dim);line-height:1.5;margin:-4px 0 10px}

  .inv{border:1px solid var(--border2);border-radius:11px;background:var(--surface);
       margin-bottom:8px;overflow:hidden}
  .inv.gone{opacity:.6}
  .inv-head{display:flex;align-items:center;gap:11px;padding:12px 13px;cursor:pointer}
  .inv-head:hover{background:var(--surface2)}
  .inv-body{flex:1;min-width:0}
  .inv .who{font-size:15px;font-weight:600;letter-spacing:-.005em}
  .inv .meta{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:3px}
  .inv .clock{font-family:var(--mono);font-size:11px;margin-top:3px}
  .inv .clock.soon{color:var(--amber)}
  .inv .clock.gone{color:var(--red)}
  .inv .clock.off{color:var(--blue)}
  /* Already asked for. Amber when the amounts disagree, because that is a
     judgement call; blue when an invoice is merely filed and unpaid. */
  .inv .asked{font-family:var(--mono);font-size:10.5px;margin-top:3px;color:var(--blue)}
  .inv .asked.odd{color:var(--amber)}
  .note{font-size:12.5px;color:var(--amber);line-height:1.5;margin:-6px 0 14px}
  .inv .amt{font-family:var(--mono);font-size:16px;font-weight:600;flex-shrink:0}

  .lines{border-top:1px solid var(--border);padding:4px 13px 10px}
  .line{display:flex;align-items:baseline;gap:10px;padding:6px 0;font-size:12.5px}
  .line + .line{border-top:1px solid #20242a}
  .line .when{font-family:var(--mono);font-size:10.5px;color:var(--dim);flex-shrink:0;
       min-width:104px}
  .line .where{flex:1;min-width:0}
  .line .late{font-family:var(--mono);font-size:10px;color:var(--amber)}
  .line .cost{font-family:var(--mono);font-size:12px;flex-shrink:0}
  .acts{display:flex;gap:8px;flex-wrap:wrap;padding:10px 13px 12px;border-top:1px solid var(--border)}
  .btn{font:inherit;font-size:12.5px;font-weight:600;color:var(--text);background:var(--surface2);
       border:1px solid var(--border2);border-radius:8px;padding:9px 13px;cursor:pointer;
       min-height:40px;text-decoration:none;display:inline-flex;align-items:center}
  .btn:hover{border-color:var(--muted)}
  .btn.go{color:var(--green);border-color:#2b4a3c}
  .btn.go:hover{background:#15241d}

  .empty{padding:36px 16px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.55}
  .err{padding:12px 14px;border-radius:9px;background:#1a1214;border:1px solid #4a2a29;
       color:var(--red);font-size:13px;line-height:1.45;margin-bottom:14px}
</style>
</head>
<body>
<main>
  <header>
    <div class="row">
      <h1>Invoices</h1>
      <div class="nav"><a href="../tolls/">Tolls</a><a href="../fleet/">Fleet</a></div>
    </div>
    <div class="stamp" id="stamp">loading…</div>
  </header>

  <div class="err" id="err" hidden></div>

  <div class="stats">
    <div class="stat"><div class="k">to bill</div><div class="v" id="s-total">—</div>
      <div class="n">across all rentals</div></div>
    <div class="stat urgent"><div class="k">due soon</div><div class="v" id="s-urgent">—</div>
      <div class="n" id="s-urgent-note">within 3 weeks</div></div>
    <div class="stat gone"><div class="k">past the window</div><div class="v" id="s-gone">—</div>
      <div class="n">cannot be filed</div></div>
  </div>

  <div class="note" id="look" hidden></div>

  <div id="groups"></div>
</main>

<script>
(function () {
  "use strict";

  var API = (function () {
    var override = new URLSearchParams(location.search).get("api");
    if (override) return override.replace(/\/$/, "");
    var meta = document.querySelector('meta[name="turonomics-api"]');
    return (meta && meta.content ? meta.content : "").replace(/\/$/, "");
  })();

  // Anything inside this is the work for this week rather than this month. The
  // API decides the same number for its own total; this is only for grouping.
  var URGENT_DAYS = 21;

  var state = { data: null, busy: false, open: {} };
  var TOKEN_KEY = "turonomics.tolls.token";

  function el(id) { return document.getElementById(id); }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }

  function add(parent, tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    parent.appendChild(node);
    return node;
  }

  function money(cents) {
    var n = Math.abs(cents | 0);
    return (cents < 0 ? "-" : "") + "$" +
      Math.floor(n / 100).toLocaleString("en-US") + "." + String(n % 100).padStart(2, "0");
  }

  function when(iso, withTime) {
    var d = new Date(iso);
    if (isNaN(d)) return String(iso || "");
    return d.toLocaleString("en-US", Object.assign(
      { timeZone: "America/New_York", month: "short", day: "numeric" },
      withTime ? { hour: "numeric", minute: "2-digit" } : {}
    ));
  }

  function token() {
    try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; }
  }
  function rememberToken(v) {
    try { v ? localStorage.setItem(TOKEN_KEY, v) : localStorage.removeItem(TOKEN_KEY); }
    catch (e) { /* private window */ }
  }
  function ensureToken() {
    if (!state.data || !state.data.token_required || token()) return true;
    var entered = window.prompt("This API needs the tolls token (TOLLS_TOKEN) to make changes.");
    if (!entered) return false;
    rememberToken(entered.trim());
    return true;
  }
  function authHeaders() {
    var v = token();
    return v ? { Authorization: "Bearer " + v } : {};
  }
  function handleStatus(r) {
    if (r.status === 401) {
      rememberToken("");
      throw new Error("the token was rejected — it will be asked for again");
    }
    return r;
  }

  function fail(message) {
    var box = el("err");
    box.textContent = message;
    box.hidden = false;
  }

  // How long is left, said the way it is acted on. The sign matters more than
  // the number: "4 days left" and "5 days ago" are different jobs.
  function clockNote(invoice) {
    if (invoice.off_platform) return { text: "off-platform — no Turo deadline", kind: "off" };
    var d = invoice.days_left;
    if (d == null) return null;
    if (d < 0) {
      return { text: Math.abs(d) + (Math.abs(d) === 1 ? " day" : " days") +
               " past the window — cannot be filed", kind: "gone" };
    }
    var left = d === 0 ? "last day to file" : d + (d === 1 ? " day left" : " days left");
    return { text: left + " · by " + when(invoice.file_by), kind: d <= URGENT_DAYS ? "soon" : "" };
  }

  function renderLines(invoice, into) {
    var wrap = add(into, "div", "lines");
    invoice.lines.forEach(function (line) {
      var row = add(wrap, "div", "line");
      add(row, "div", "when", when(line.occurred_at, true));
      var where = add(row, "div", "where");
      add(where, "span", null, line.plaza);
      // The line a guest is most likely to query, so it says why it is here.
      if (line.overrun_seconds != null) {
        var m = Math.round(line.overrun_seconds / 60);
        var over = m < 60 ? m + "m" : Math.floor(m / 60) + "h " + (m % 60) + "m";
        add(where, "div", "late", "after the trip ended — " + over + " over");
      }
      add(row, "div", "cost", money(line.amount_cents));
    });

    var acts = add(into, "div", "acts");
    if (invoice.turo_trip_id) {
      var link = add(acts, "a", "btn", "Open on Turo");
      link.href = "https://turo.com/us/en/reservation/" + invoice.turo_trip_id;
      link.target = "_blank";
      link.rel = "noreferrer";
    }
    var done = add(acts, "button", "btn go",
                   "Mark " + money(invoice.total_cents) + " billed back");
    done.addEventListener("click", function (ev) {
      ev.stopPropagation();
      markBilled(invoice);
    });
  }

  function renderInvoice(invoice, into) {
    var card = add(into, "div", "inv" + (invoice.expired ? " gone" : ""));
    var head = add(card, "div", "inv-head");
    var body = add(head, "div", "inv-body");
    add(body, "div", "who",
        (invoice.guest_name || "No name") + " — " + (invoice.vehicle_nickname || "?"));
    add(body, "div", "meta",
        invoice.lines.length + (invoice.lines.length === 1 ? " crossing · " : " crossings · ") +
        when(invoice.starts_at) + " → " + when(invoice.ends_at));
    var clock = clockNote(invoice);
    if (clock) add(body, "div", "clock " + clock.kind, clock.text);

    // What Turo has already been asked for on this rental. Shown because
    // invoicing money the guest has paid is a dispute, not income.
    if (invoice.charged_but_different) {
      add(body, "div", "asked odd",
          "Turo already charged " + money(invoice.charged_cents) +
          " here — these crossings are " + money(invoice.total_cents) +
          ", so check before asking again");
    } else if (invoice.charged_cents) {
      add(body, "div", "asked",
          money(invoice.charged_cents) + " already charged on this rental");
    } else if (invoice.pending_cents) {
      add(body, "div", "asked",
          "an invoice for " + money(invoice.pending_cents) + " is filed and unpaid");
    }
    add(head, "div", "amt", money(invoice.total_cents));

    // Collapsed by default: the list is for deciding what to do next, and the
    // lines are for when one has been picked.
    if (state.open[invoice.trip_id]) renderLines(invoice, card);
    head.addEventListener("click", function () {
      state.open[invoice.trip_id] = !state.open[invoice.trip_id];
      render();
    });
  }

  function group(title, kind, lede, invoices, into) {
    if (!invoices.length) return;
    add(into, "h2", kind, title);
    if (lede) add(into, "div", "lede", lede);
    invoices.forEach(function (invoice) { renderInvoice(invoice, into); });
  }

  function render() {
    var data = state.data;
    if (!data) return;
    el("s-total").textContent = money(data.billable_cents);
    el("s-urgent").textContent = money(data.urgent_cents);
    el("s-gone").textContent = money(data.expired_cents);
    el("s-urgent-note").textContent = "within 3 weeks of the " +
      data.window_days + "-day deadline";

    // Charged invoices whose totals matched nothing on file. Not written off,
    // because an invoice covers cleaning and fuel as readily as tolls.
    var look = el("look");
    if (data.needs_a_look_cents) {
      look.textContent = money(data.needs_a_look_cents) +
        " of crossings sit on rentals Turo has already charged for a different amount. " +
        "Those could be paid already — worth checking before billing again.";
      look.hidden = false;
    } else {
      look.hidden = true;
    }

    var groups = el("groups");
    clear(groups);
    var all = data.invoices || [];
    if (!all.length) {
      add(groups, "div", "empty", "Nothing to bill. Every attributed crossing has been recovered.");
      return;
    }

    var expired = all.filter(function (i) { return i.expired; });
    var off = all.filter(function (i) { return i.off_platform; });
    var soon = all.filter(function (i) {
      return !i.expired && !i.off_platform && i.days_left <= URGENT_DAYS;
    });
    var later = all.filter(function (i) {
      return !i.expired && !i.off_platform && i.days_left > URGENT_DAYS;
    });

    group("File these first", "urgent",
          "Soonest deadline at the top. Turo takes a toll reimbursement for " +
          data.window_days + " days after a trip ends.", soon, groups);
    group("Still plenty of time", "", null, later, groups);
    group("Off-platform", "",
          "Arranged outside Turo, so there is nothing to file and no deadline — " +
          "these have to be invoiced directly.", off, groups);
    group("Past the window", "gone",
          "Turo will no longer accept these. Kept visible so the total is honest, " +
          "not because there is anything left to do about them.", expired, groups);
  }

  function markBilled(invoice) {
    if (state.busy || !ensureToken()) return;
    if (!window.confirm(
      "Mark " + money(invoice.total_cents) + " from " +
      (invoice.guest_name || "this rental") + " as billed back?\n\n" +
      "This records that you filed it. It does not file anything itself."
    )) return;
    state.busy = true;
    fetch(API + "/api/invoices/" + invoice.trip_id + "/recovered",
          { method: "POST", headers: authHeaders() })
      .then(handleStatus)
      .then(function (r) {
        if (!r.ok) throw new Error("the API said " + r.status);
        return r.json();
      })
      .then(function () { return load(); })
      .catch(function (e) { fail("Could not mark that invoice: " + e.message); })
      .then(function () { state.busy = false; });
  }

  function load() {
    return fetch(API + "/api/invoices")
      .then(function (r) {
        if (!r.ok) throw new Error("the API said " + r.status);
        return r.json();
      })
      .then(function (data) {
        state.data = data;
        var n = (data.invoices || []).length;
        el("stamp").textContent = n + (n === 1 ? " rental to bill" : " rentals to bill");
        el("err").hidden = true;
        render();
      })
      .catch(function (e) {
        el("stamp").textContent = "";
        fail("Could not load invoices: " + e.message);
      });
  }

  load();
})();
</script>
</body>
</html>
