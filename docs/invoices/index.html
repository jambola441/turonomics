<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e171e">
<meta name="turonomics-api" content="https://turonomics.onrender.com">
<title>Turonomics — Invoices</title>
<link rel="apple-touch-icon" href="../fleet/icons/icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../uniform.css">
<link rel="stylesheet" href="../shell.css">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--u-font-sans);
    background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));
  }
  main{max-width:820px;margin:0 auto;padding:0 16px}
  header{padding:14px 0 12px;border-bottom:1px solid var(--border);margin-bottom:12px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  h1{font-size:24px;font-weight:700;letter-spacing:-.02em}

  /* The totals, as one line under the purpose rather than three tiles above
     the work: they say how much, the list says what to do. */
  .totals{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:var(--tn-small);color:var(--dim)}
  .totals b{font-family:var(--mono);font-weight:600;color:var(--text);font-size:14px}
  .totals .urgent b{color:var(--amber)}
  .totals .gone b{color:var(--red)}
  .stamp{font-size:var(--tn-small);color:var(--dim);margin-top:4px}

  /* The extension: one line and two buttons. Its log folds to the newest
     entry, so a failed run from last week is not the first thing read. */
  .remote{margin:0 0 14px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--u-radius-md)}
  .remote-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 10px}
  .remote-status{font-size:var(--tn-small);color:var(--muted);flex:1 1 220px;line-height:1.4}
  .remote-status.on{color:var(--green)}
  .remote-buttons{display:flex;gap:8px;flex-wrap:wrap}
  .remote-log-wrap{margin-top:8px;font-size:var(--tn-small)}
  .remote-log-wrap>summary{cursor:pointer;color:var(--muted);line-height:1.45;list-style-position:inside}
  .remote-log{list-style:none;margin:6px 0 0;padding:0}
  .remote-log li{padding:5px 0;border-top:1px solid var(--line);line-height:1.45}
  .st{font-family:var(--mono);font-size:var(--tn-label);letter-spacing:.06em;
      text-transform:uppercase;margin-right:6px;color:var(--dim)}
  .st.running,.st.queued{color:var(--amber)}
  .st.done{color:var(--green)}
  .st.failed,.st.abandoned{color:var(--red)}

  h2{font-family:var(--mono);font-size:var(--tn-label);letter-spacing:.12em;text-transform:uppercase;
     color:var(--muted);font-weight:600;margin:20px 0 8px}
  h2.urgent{color:var(--amber)}
  .lede{font-size:13px;color:var(--dim);line-height:1.5;margin:-2px 0 10px}

  .inv{border:1px solid var(--border2);border-radius:var(--u-radius-lg);background:var(--surface);
       margin-bottom:8px;overflow:hidden;scroll-margin-top:12px}
  .inv:target,.inv.linked{border-color:var(--u-link)}
  .inv-head{display:flex;align-items:flex-start;gap:11px;padding:12px 13px;cursor:pointer;
            width:100%;background:none;border:0;font:inherit;color:inherit;text-align:left}
  .inv-head:hover{background:var(--surface2)}
  .inv-body{flex:1;min-width:0}
  .inv .who{font-size:var(--tn-title);font-weight:600;letter-spacing:-.005em}
  .inv .meta{font-size:var(--tn-small);color:var(--muted);margin-top:3px}
  .inv .clock{font-size:var(--tn-small);margin-top:3px;font-weight:600}
  .inv .clock.soon{color:var(--amber)}
  .inv .clock.gone{color:var(--red)}
  .inv .clock.off{color:var(--blue)}
  /* Already asked for. Amber when the amounts disagree, because that is a
     judgement call; blue when an invoice is merely filed and unpaid. */
  .inv .asked{font-size:var(--tn-small);margin-top:4px;color:var(--blue);line-height:1.45}
  .inv .asked.odd{color:var(--amber)}
  .inv .asked.seen{color:var(--dim)}
  .inv .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
  .inv .amt{font-family:var(--mono);font-size:16px;font-weight:600}
  /* Says the card opens, which a bordered box alone did not. */
  .inv .more{font-size:12px;color:var(--u-link)}
  .inv .more::after{content:" ▾"}
  .inv.open .more::after{content:" ▴"}
  .quick{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:0 13px 12px}

  .lines{border-top:1px solid var(--border);padding:4px 13px 10px}
  .line{display:flex;align-items:baseline;gap:10px;padding:7px 0;font-size:13.5px}
  .line + .line{border-top:1px solid var(--border)}
  .line .when{font-size:var(--tn-small);color:var(--dim);flex-shrink:0;min-width:112px}
  .line .where{flex:1;min-width:0}
  .line .late{font-size:12px;color:var(--amber)}
  .line .cost{font-family:var(--mono);font-size:13px;flex-shrink:0}
  .acts{display:flex;gap:8px;flex-wrap:wrap;padding:10px 13px 12px;border-top:1px solid var(--border)}
  .btn{font:inherit;font-size:13px;font-weight:600;color:var(--text);background:var(--surface2);
       border:1px solid var(--border2);border-radius:var(--u-radius-md);padding:9px 13px;cursor:pointer;
       min-height:40px;text-decoration:none;display:inline-flex;align-items:center}
  .btn:hover{border-color:var(--muted)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.go{color:var(--green);border-color:var(--u-ok-line)}
  .btn.go:hover{background:var(--u-ok-bg)}
  .btn.small{min-height:34px;padding:6px 11px;font-size:12.5px}

  /* What can no longer be filed, folded: kept so the totals add up, not
     because there is anything to do about it. */
  details.archive{margin-top:20px;border-top:1px solid var(--line);padding-top:10px}
  details.archive>summary{cursor:pointer;font-size:13px;color:var(--dim);padding:6px 0;line-height:1.45}
  details.archive .inv{opacity:.7}

  .ledger{margin-top:20px;border-top:1px solid var(--line);padding-top:10px}
  .ledger>summary{cursor:pointer;font-size:13px;color:var(--dim);padding:6px 0}
  .ledger-totals{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 14px;
    font-family:var(--mono);font-size:12px;color:var(--dim)}
  .ledger-cover{font-size:13px;color:var(--muted);margin:0 0 10px}
  .lrows{display:flex;flex-direction:column}
  .lrow{display:flex;gap:12px;justify-content:space-between;padding:10px 2px;
    border-bottom:1px solid var(--line)}
  .lmain{min-width:0;flex:1}
  .lname{font-size:14px;font-weight:600}
  .lrow .who{font-size:var(--tn-small);color:var(--dim);margin-top:2px}
  .lfig{font-family:var(--mono);font-size:12.5px;margin-top:4px}
  .lturo{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px}
  .lturo .unread{color:var(--amber)}
  .lside{text-align:right;flex-shrink:0;max-width:45%}
  .lrow .btn{font-size:12px;padding:4px 10px;margin-top:5px;min-height:32px}
  .lrow .trip-link{font-size:12px;color:var(--blue);text-decoration:none;font-weight:400}
  .lquiet>summary{cursor:pointer;font-size:13px;color:var(--dim);padding:10px 0}
  .ledger-state{font-family:var(--mono);font-size:var(--tn-label);letter-spacing:.06em;
    text-transform:uppercase;white-space:nowrap}
  .ledger-state.tobill{color:var(--amber)}
  .ledger-state.expired{color:var(--dim)}
  .dist{font-family:var(--mono);font-size:12px;color:var(--amber);margin-top:4px}
  .dist.gone{color:var(--dim)}
  .ledger-note{font-size:12.5px;color:var(--amber);margin-top:3px;line-height:1.45}

  .empty{padding:36px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.55}
  .err{padding:12px 14px;border-radius:var(--u-radius-md);background:var(--u-err-bg);border:1px solid var(--u-err-line);
       color:var(--red);font-size:13.5px;line-height:1.45;margin-bottom:14px}
</style>
</head>
<body>
<main>
  <header>
    <div class="row">
      <h1>Invoices<span class="u-dot">.</span></h1>
      <nav data-tn-nav="invoices"></nav>
    </div>
    <p class="tn-purpose">What to ask Turo for, soonest deadline first.</p>
    <div class="totals">
      <span>to bill <b id="s-total">—</b></span>
      <span class="urgent">due within 3 weeks <b id="s-urgent">—</b></span>
      <span class="gone">past the window <b id="s-gone">—</b></span>
    </div>
    <div class="stamp" id="stamp">loading…</div>
  </header>

  <div class="err" id="err" hidden></div>

  <!-- The site cannot talk to Turo; the extension in the operator's own
       browser can. A button here queues a command and the extension runs it
       within a few seconds, if Chrome is open somewhere with it installed. -->
  <section class="remote" id="remote">
    <div class="remote-head">
      <span class="remote-status" id="remoteStatus">looking for the extension…</span>
      <span class="remote-buttons">
        <button class="btn small" id="pullTuro" type="button">Pull from Turo</button>
        <button class="btn small" id="readEzpass" type="button">Read E-ZPass</button>
      </span>
    </div>
    <details class="remote-log-wrap" id="remoteLogWrap" hidden>
      <summary id="remoteLast"></summary>
      <ol class="remote-log" id="remoteLog"></ol>
    </details>
  </section>

  <div id="groups"></div>

  <!-- Every rental with crossings, including the ones already dealt with. The
       groups above answer "what next" and so leave those out; this answers
       "where did it all go", which needs them or the totals do not add up. -->
  <details id="ledgerWrap" class="ledger">
    <summary>Every rental on the account, and what became of its crossings</summary>
    <div class="ledger-totals" id="ledgerTotals"></div>
    <div class="ledger-cover" id="ledgerCover"></div>
    <div class="lrows" id="ledgerBody"></div>
    <details class="lquiet" id="ledgerQuietWrap" hidden>
      <summary id="ledgerQuietSum"></summary>
      <div class="lrows" id="ledgerQuiet"></div>
    </details>
  </details>
</main>

<script src="../shell.js"></script>
<script>
(function () {
  "use strict";

  var API = TN.API;
  var name = TN.personName;

  // Anything inside this is the work for this week rather than this month. The
  // API decides the same number for its own total; this is only for grouping.
  var URGENT_DAYS = 21;

  var state = { data: null, busy: false, open: {}, ledger: {}, ext: null };

  function el(id) { return document.getElementById(id); }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }

  function add(parent, tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    parent.appendChild(node);
    return node;
  }

  function money(cents) {
    var n = Math.abs(cents | 0);
    return (cents < 0 ? "-" : "") + "$" +
      Math.floor(n / 100).toLocaleString("en-US") + "." + String(n % 100).padStart(2, "0");
  }

  function when(iso, withTime) {
    var d = new Date(iso);
    if (isNaN(d)) return String(iso || "");
    return d.toLocaleString("en-US", Object.assign(
      { timeZone: "America/New_York", month: "short", day: "numeric" },
      withTime ? { hour: "numeric", minute: "2-digit" } : {}
    ));
  }

  // A rejected token is a wrong token. Forgetting it means the next attempt
  // asks again rather than failing the same way forever.
  function handleStatus(r) {
    if (r.status === 401) {
      TN.rememberToken("");
      throw new Error("the token was rejected — it will be asked for again");
    }
    return r;
  }

  function fail(message) {
    var box = el("err");
    box.textContent = message;
    box.hidden = false;
  }

  // How long is left, said the way it is acted on. The sign matters more than
  // the number: "4 days left" and "5 days ago" are different jobs.
  function clockNote(invoice) {
    if (invoice.off_platform) return { text: "off-platform — no Turo deadline", kind: "off" };
    var d = invoice.days_left;
    if (d == null) return null;
    if (d < 0) {
      return { text: Math.abs(d) + (Math.abs(d) === 1 ? " day" : " days") +
               " past the window — cannot be filed", kind: "gone" };
    }
    var left = d === 0 ? "last day to file" : d + (d === 1 ? " day left" : " days left");
    return { text: left + " · by " + when(invoice.file_by), kind: d <= URGENT_DAYS ? "soon" : "" };
  }

  function renderLines(invoice, into) {
    var wrap = add(into, "div", "lines");
    invoice.lines.forEach(function (line) {
      var row = add(wrap, "div", "line");
      add(row, "div", "when", when(line.occurred_at, true));
      var where = add(row, "div", "where");
      add(where, "span", null, line.plaza);
      // The line a guest is most likely to query, so it says why it is here.
      if (line.overrun_seconds != null) {
        var m = Math.round(line.overrun_seconds / 60);
        var over = m < 60 ? m + "m" : Math.floor(m / 60) + "h " + (m % 60) + "m";
        add(where, "div", "late", "after the trip ended — " + over + " over");
      }
      add(row, "div", "cost", money(line.amount_cents));
    });

    var acts = add(into, "div", "acts");
    if (invoice.turo_trip_id) {
      var link = add(acts, "a", "btn", "Open on Turo");
      link.href = "https://turo.com/us/en/reservation/" + invoice.turo_trip_id;
      link.target = "_blank";
      link.rel = "noreferrer";
    }
    var trip = add(acts, "a", "btn", "The whole trip");
    trip.href = TN.withApi("../trips/") + "#" + invoice.trip_id;
    var done = add(acts, "button", "btn go",
                   "Mark " + money(invoice.total_cents) + " billed back");
    done.type = "button";
    done.addEventListener("click", function () { markBilled(invoice); });
  }

  // The ledger's word on whether this rental can be filed from here now.
  function fileable(invoice) {
    var row = state.ledger[invoice.trip_id];
    return !!(row && invoice.turo_trip_id &&
              (row.state === "to bill" || row.state === "partly billed") &&
              row.days_left != null && row.days_left >= 0) ? row : null;
  }

  function renderAsked(invoice, body) {
    // What Turo has already been asked for on this rental. Shown because
    // invoicing money the guest has paid is a dispute, not income.
    if (invoice.charged_but_different) {
      // Only when Turo's side cannot be squared with these crossings: a charge
      // nobody has broken down, or a toll line that disagrees.
      var why = invoice.charged_tolls_cents != null
        ? "its toll line was " + money(invoice.charged_tolls_cents) +
          " and these crossings are " + money(invoice.total_cents) +
          (invoice.charged_tolls_cents < invoice.total_cents
            ? ", so " + money(invoice.total_cents - invoice.charged_tolls_cents) +
              " of tolls is missing"
            : "")
        : "some of it has not been broken down yet — pull from Turo to read it";
      if (invoice.checked_at) {
        add(body, "div", "asked seen",
            "Turo charged " + money(invoice.charged_cents) + " here — checked " +
            when(invoice.checked_at) + " (" + why + ")");
      } else {
        add(body, "div", "asked odd",
            "Turo already charged " + money(invoice.charged_cents) + " here — " + why +
            ", so check before asking again");
      }
      if (invoice.charged_lines && invoice.charged_lines.length) {
        add(body, "div", "asked", "charges: " + invoice.charged_lines.join(" · "));
      }
    } else if (invoice.charged_cents) {
      // Plainly something else — a ticket, distance — so said as that, and no
      // reason to hold the tolls back.
      add(body, "div", "asked",
          "Turo charged " + money(invoice.charged_cents) + " here for other things" +
          (invoice.charged_lines && invoice.charged_lines.length
            ? ": " + invoice.charged_lines.join(" · ") : "") +
          " — none of it tolls");
    } else if (invoice.pending_cents) {
      add(body, "div", "asked",
          "an invoice for " + money(invoice.pending_cents) + " is filed and unpaid");
    }
  }

  function renderInvoice(invoice, into) {
    var open = !!state.open[invoice.trip_id];
    var card = add(into, "div", "inv" + (open ? " open" : "") +
                   (state.linked === invoice.trip_id ? " linked" : ""));
    card.id = "rental-" + invoice.trip_id;
    var head = add(card, "button", "inv-head");
    head.type = "button";
    head.setAttribute("aria-expanded", open ? "true" : "false");
    var body = add(head, "div", "inv-body");
    add(body, "div", "who",
        (name(invoice.guest_name) || "No name") + " — " + (invoice.vehicle_nickname || "?"));
    add(body, "div", "meta",
        when(invoice.starts_at) + " → " + when(invoice.ends_at) + " · " +
        invoice.lines.length + (invoice.lines.length === 1 ? " crossing" : " crossings"));
    var clock = clockNote(invoice);
    if (clock) add(body, "div", "clock " + clock.kind, clock.text);
    renderAsked(invoice, body);
    var side = add(head, "div", "side");
    add(side, "div", "amt", money(invoice.total_cents));
    add(side, "div", "more", open ? "hide" : "crossings");

    // The two things to do with a rental, on its face rather than behind a
    // click: file it, and say Turo's charge has been looked at.
    var quick = document.createElement("div");
    quick.className = "quick";
    var row = fileable(invoice);
    if (row) {
      var file = add(quick, "button", "btn go small", "File " + money(row.unfiled_cents) + " on Turo");
      file.type = "button";
      if (state.ext && !state.ext.listening && !state.ext.extension_seen_at) {
        file.disabled = true;
        add(quick, "span", "tn-why-off", "needs the extension installed");
      }
      file.addEventListener("click", function () { queueFiling(row, invoice); });
    }
    if (invoice.charged_but_different && !invoice.expired) {
      var check = add(quick, "button", "btn small",
                      invoice.checked_at ? "Undo checked" : "Mark Turo's charge checked");
      check.type = "button";
      check.addEventListener("click", function () { markChecked(invoice); });
    }
    if (quick.firstChild) card.appendChild(quick);

    // Collapsed by default: the list is for deciding what to do next, and the
    // lines are for when one has been picked.
    if (open) renderLines(invoice, card);
    head.addEventListener("click", function () {
      state.open[invoice.trip_id] = !state.open[invoice.trip_id];
      // The address names the rental, so it can be sent or bookmarked.
      try {
        history.replaceState(null, "", state.open[invoice.trip_id]
          ? "#" + invoice.trip_id : location.pathname + location.search);
      } catch (e) { /* file:// */ }
      render();
    });
  }

  function group(title, kind, lede, invoices, into) {
    if (!invoices.length) return;
    add(into, "h2", kind, title);
    if (lede) add(into, "div", "lede", lede);
    invoices.forEach(function (invoice) { renderInvoice(invoice, into); });
  }

  function render() {
    var data = state.data;
    if (!data) return;
    el("s-total").textContent = money(data.billable_cents);
    el("s-urgent").textContent = money(data.urgent_cents);
    el("s-gone").textContent = money(data.expired_cents);

    var groups = el("groups");
    clear(groups);
    var all = data.invoices || [];
    if (!all.length) {
      add(groups, "div", "empty", "Nothing to bill. Every attributed crossing has been recovered.");
      return;
    }

    var expired = all.filter(function (i) { return i.expired; });
    var off = all.filter(function (i) { return i.off_platform; });
    var soon = all.filter(function (i) {
      return !i.expired && !i.off_platform && i.days_left <= URGENT_DAYS;
    });
    var later = all.filter(function (i) {
      return !i.expired && !i.off_platform && i.days_left > URGENT_DAYS;
    });

    group("File these first", "urgent",
          "Soonest deadline at the top. Turo takes a toll reimbursement for " +
          data.window_days + " days after a trip ends.", soon, groups);
    group("Still plenty of time", "", null, later, groups);
    group("Off-platform", "",
          "Arranged outside Turo, so there is nothing to file and no deadline — " +
          "these have to be invoiced directly.", off, groups);
    if (expired.length) {
      var archive = add(groups, "details", "archive");
      // Open when a link points into it, so the linked rental is visible, and
      // kept as it was left across the redraws the extension's polling makes.
      archive.open = !!state.archiveOpen ||
        expired.some(function (i) { return state.linked === i.trip_id; });
      archive.addEventListener("toggle", function () { state.archiveOpen = archive.open; });
      add(archive, "summary", null, "Past the window — " + expired.length +
          (expired.length === 1 ? " rental, " : " rentals, ") +
          money(data.expired_cents) + ". Turo no longer takes these; kept so the total is honest.");
      expired.forEach(function (invoice) { renderInvoice(invoice, archive); });
    }
  }

  function post(path) {
    return TN.needToken(state.data && state.data.token_required).then(function (ok) {
      if (!ok) throw new Error("the token is needed for this");
      return fetch(API + path, { method: "POST", headers: TN.authHeaders() });
    }).then(handleStatus).then(function (r) {
      if (!r.ok) throw new Error("the API said " + r.status);
      return r.json();
    });
  }

  function markBilled(invoice) {
    if (state.busy) return;
    if (!window.confirm(
      "Mark " + money(invoice.total_cents) + " from " +
      (name(invoice.guest_name) || "this rental") + " as billed back?\n\n" +
      "This records that you filed it. It does not file anything itself."
    )) return;
    state.busy = true;
    post("/api/invoices/" + invoice.trip_id + "/recovered")
      .then(function () { return load(); })
      .catch(function (e) { fail("Could not mark that invoice: " + e.message); })
      .then(function () { state.busy = false; });
  }

  // Says Turo's charge on this rental has been looked at. The API keeps it
  // with the charge it covered, so a new charge from Turo brings the warning
  // back by itself.
  function markChecked(invoice) {
    if (state.busy) return;
    state.busy = true;
    post("/api/invoices/" + invoice.trip_id + "/checked" + (invoice.checked_at ? "?undo=true" : ""))
      .then(function () { return load(); })
      .catch(function (e) { fail("Could not mark it checked: " + e.message); })
      .then(function () { state.busy = false; });
  }

  // One row per rental, as a short list rather than a thirteen-column table:
  // only the figures that are not zero, ours on one line and Turo's on the
  // next, and the state with what can be done about it on the right. Rentals
  // with nothing on them at all are folded away at the bottom.
  function renderLedger(data) {
    var body = el("ledgerBody");
    var quiet = el("ledgerQuiet");
    body.textContent = "";
    quiet.textContent = "";
    var quietCount = 0;
    state.ledger = {};
    (data.rows || []).forEach(function (row) {
      state.ledger[row.trip_id] = row;
      // Folded: covered by a statement, no crossings, nothing from Turo. A
      // rental outside every statement stays in view, since importing another
      // date range is something to do about it.
      var empty = row.state === "no crossings" && !row.charged_cents && !row.asked_cents &&
        !row.turo_unknown_cents && !row.distance_unbilled_cents;
      if (empty) quietCount++;
      var item = document.createElement("div");
      item.className = "lrow";
      var main = add(item, "div", "lmain");
      var title = add(main, "div", "lname",
                      (row.vehicle_nickname || "—") + " · " + (name(row.guest_name) || "—"));
      // Everything about the rental — Turo's side, invoices, crossings — is
      // one click away on the trips page.
      var link = document.createElement("a");
      link.href = TN.withApi("../trips/") + "#" + row.trip_id;
      link.className = "trip-link";
      link.textContent = "trip ›";
      title.appendChild(document.createTextNode(" "));
      title.appendChild(link);
      add(main, "div", "who", "ended " + when(row.ends_at) +
        (row.turo_trip_id ? "" : " · off-platform") +
        (row.days_left == null ? "" : row.days_left < 0 ? " · window closed" :
          " · " + row.days_left + " days left"));
      var ours = [["tolls", row.tolls_cents], ["to bill", row.unfiled_cents],
                  ["asked", row.filed_cents], ["settled", row.recovered_cents]]
        .filter(function (p) { return p[1]; })
        .map(function (p) { return p[0] + " " + money(p[1]); });
      add(main, "div", "lfig", ours.length ? ours.join(" · ") : "no crossings");
      var kinds = [["tolls", row.turo_tolls_cents], ["tickets", row.turo_tickets_cents],
                   ["distance", row.turo_distance_cents], ["other", row.turo_other_cents]]
        .filter(function (p) { return p[1]; })
        .map(function (p) { return p[0] + " " + money(p[1]); });
      if (row.charged_cents || kinds.length || row.turo_unknown_cents) {
        // What Turo invoiced, by kind, and how much of it has been charged:
        // an invoice can be asked for and not yet paid.
        var turo = add(main, "div", "lturo", "Turo invoiced " +
          (kinds.length ? kinds.join(" · ") : money(row.asked_cents)) +
          " · charged " + money(row.charged_cents));
        if (row.turo_unknown_cents) {
          // Money Turo invoiced that nobody has broken down yet: amber,
          // because it is the part that may be these tolls.
          add(turo, "span", "unread", " · +" + money(row.turo_unknown_cents) + " not broken down");
        }
      }
      if (row.note) add(main, "div", "ledger-note", row.note);
      var side = add(item, "div", "lside");
      add(side, "div", "ledger-state " +
        (row.state === "to bill" || row.state === "partly billed" ||
         row.state === "short" || row.state.indexOf("check ") === 0 ||
         row.state === "no statement yet" ? "tobill" :
         row.state === "expired" ? "expired" : ""), row.state);
      if (row.turo_trip_id && (row.state === "to bill" || row.state === "partly billed") &&
          row.days_left != null && row.days_left >= 0) {
        var file = add(side, "button", "btn go", "File " + money(row.unfiled_cents));
        file.type = "button";
        file.addEventListener("click", function () { queueFiling(row); });
      }
      // Additional distance beside the tolls, tolls | distance, while the
      // window is open. Filed on Turo for now: the site cannot file it yet.
      if (row.distance_unbilled_cents && row.days_left != null) {
        var closed = row.days_left < 0;
        add(side, "div", "dist" + (closed ? " gone" : ""),
            "| " + money(row.distance_unbilled_cents) + " distance" + (closed ? " expired" : ""));
      }
      (empty ? quiet : body).appendChild(item);
    });
    el("ledgerQuietWrap").hidden = !quietCount;
    el("ledgerQuietSum").textContent = quietCount + (quietCount === 1 ? " rental" : " rentals") +
      " with no crossings and nothing from Turo";
    el("ledgerTotals").textContent =
      "tolls " + money(data.tolls_cents) +
      " · to bill " + money(data.unfiled_cents) +
      " · asked " + money(data.filed_cents) +
      " · settled " + money(data.recovered_cents) +
      (data.distance_collectable_cents
        ? " | distance to file " + money(data.distance_collectable_cents) : "") +
      (data.distance_lost_cents
        ? " | distance expired " + money(data.distance_lost_cents) : "");
    el("ledgerCover").textContent = data.statements_from
      ? "E-ZPass statements imported cover " + when(data.statements_from) + " – " +
        when(data.statements_to) + ". Rentals outside that read “no statement yet”."
      : "No E-ZPass statement imported yet.";
    el("ledgerWrap").hidden = !(data.rows || []).length;
    // The cards' File buttons come from the ledger's word.
    render();
  }

  // -------------------------------------------------------------------------
  // Commands for the extension
  // -------------------------------------------------------------------------

  var remote = { polling: null, active: {} };

  function ago(iso) {
    var s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
    if (s < 90) return s + "s ago";
    var m = Math.round(s / 60);
    if (m < 90) return m + " min ago";
    var h = Math.round(m / 60);
    return h < 48 ? h + " h ago" : Math.round(h / 24) + " days ago";
  }

  function commandText(c) {
    return (c.kind === "pull" ? "Pull from Turo" :
      c.kind === "tolls" ? "Read E-ZPass" :
      "File " + (name(c.guest_name) || "rental") + (c.turo_trip_id ? " · " + c.turo_trip_id : "")) +
      (c.result ? " — " + c.result : "");
  }

  function renderCommands(data) {
    state.ext = data;
    var status = el("remoteStatus");
    var never = !data.listening && !data.extension_seen_at;
    if (data.listening) {
      status.className = "remote-status on";
      status.textContent = "Extension listening" +
        (data.extension_version ? " (v" + data.extension_version + ")" : "") +
        " — these run within seconds.";
    } else {
      status.className = "remote-status";
      status.textContent = data.extension_seen_at
        ? "Extension asleep, seen " + ago(data.extension_seen_at) +
          " — queued until Chrome wakes it."
        : "No extension has checked in yet — install it in Chrome to use these.";
    }
    // Kept on screen whatever the extension is doing, and disabled only when
    // there is no extension at all, so it is clear what they are for.
    el("pullTuro").disabled = never;
    el("readEzpass").disabled = never;

    var log = el("remoteLog");
    log.textContent = "";
    var pending = false;
    var finished = false;
    var shown = (data.commands || []).slice(0, 6);
    shown.forEach(function (c) {
      var li = document.createElement("li");
      add(li, "span", "st " + c.state, c.state);
      li.appendChild(document.createTextNode(commandText(c)));
      log.appendChild(li);
      if (c.state === "queued" || c.state === "running") pending = true;
      // A command seen pending and now finished means the money moved; the
      // rest of the page is reloaded so it says so.
      if (remote.active[c.id] && c.state !== "queued" && c.state !== "running") finished = true;
      remote.active[c.id] = c.state === "queued" || c.state === "running";
    });
    // The newest entry on the fold, with when; the rest under it.
    var wrap = el("remoteLogWrap");
    wrap.hidden = !shown.length;
    var last = el("remoteLast");
    last.textContent = "";
    if (shown.length) {
      add(last, "span", "st " + shown[0].state, shown[0].state);
      last.appendChild(document.createTextNode(commandText(shown[0]) +
        (shown[0].requested_at ? " · " + ago(shown[0].requested_at) : "") +
        (shown.length > 1 ? " · " + (shown.length - 1) + " earlier" : "")));
    }
    if (finished) load();
    render();
    schedule(pending ? 4000 : 30000);
  }

  function schedule(ms) {
    if (remote.polling) clearTimeout(remote.polling);
    remote.polling = setTimeout(loadCommands, ms);
  }

  function loadCommands() {
    return fetch(API + "/api/commands")
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (data) renderCommands(data);
        else { el("remoteStatus").textContent = "Could not ask the API about the extension."; schedule(30000); }
      })
      .catch(function () {
        el("remoteStatus").textContent = "Could not ask the API about the extension.";
        schedule(30000);
      });
  }

  function queue(body) {
    return TN.needToken(state.data && state.data.token_required).then(function (ok) {
      if (!ok) return null;
      return fetch(API + "/api/commands", {
        method: "POST",
        headers: Object.assign({ "Content-Type": "application/json" }, TN.authHeaders()),
        body: JSON.stringify(body)
      })
        .then(handleStatus)
        .then(function (r) {
          return r.json().catch(function () { return {}; }).then(function (b) {
            // 409 is the ledger refusing, and its reason is the useful part.
            if (!r.ok) throw new Error(b.detail || ("the API said " + r.status));
            return b;
          });
        })
        .then(function () { return loadCommands(); });
    }).catch(function (e) { fail("Could not queue that: " + e.message); });
  }

  function queueFiling(row, invoice) {
    var guest = name(row.guest_name || (invoice && invoice.guest_name));
    if (!window.confirm(
      "File " + money(row.unfiled_cents) + " of tolls to " + (guest || "this guest") +
      " on Turo?\n\nYour browser's extension files it, with the evidence sheet attached."
    )) return;
    queue({ kind: "file", trip_id: row.trip_id });
  }

  el("pullTuro").addEventListener("click", function () { queue({ kind: "pull" }); });
  // Runs in the computer's Chrome, wherever it is logged in to E-ZPass: the
  // extension reads the same windows a Send tolls click would.
  el("readEzpass").addEventListener("click", function () { queue({ kind: "tolls" }); });

  // Resolves to the status the API gave, so the caller can tell a refused
  // token (worth one more try once the list has settled on a new one) from
  // an outage (not).
  function loadLedger() {
    return fetch(API + "/api/invoices/ledger", { headers: TN.authHeaders() })
      .then(function (r) {
        if (!r.ok) return r.status;
        return r.json().then(function (data) { renderLedger(data); return r.status; });
      })
      .catch(function () {
        // The ledger is a second look at the same money, not the page's job.
        // A page that fails to load entirely because the extra view is down
        // would be worse than one without it.
        return 0;
      });
  }

  // A link to one rental — #<trip id>, from the trips page or pasted — opens
  // it and brings it into view, in the archive too.
  function openFromHash() {
    var wanted = location.hash.replace(/^#/, "");
    if (!wanted || !state.data) return;
    var found = (state.data.invoices || []).some(function (i) { return i.trip_id === wanted; });
    if (!found) return;
    state.linked = wanted;
    state.open[wanted] = true;
    render();
    var card = el("rental-" + wanted);
    if (card && card.scrollIntoView) card.scrollIntoView({ block: "start" });
  }

  function load() {
    if (!remote.polling) loadCommands();
    // Both reads go out at once when a token is already saved: each is a
    // slow query on the API's side, and one after the other was most of
    // the wait. Without a token the list goes first, since it is what asks,
    // and the ledger follows with whatever it settled on. A saved token the
    // API refuses gets the same treatment: the ledger is tried once more
    // after the list has replaced it.
    var ledger = TN.token() ? loadLedger() : Promise.resolve(401);
    return TN.authed("/api/invoices", null, "This page names guests, so it needs the tolls token.")
      .then(function (r) {
        ledger.then(function (status) { if (status === 401) loadLedger(); });
        if (!r.ok) throw new Error("the API said " + r.status);
        return r.json();
      })
      .then(function (data) {
        state.data = data;
        var n = (data.invoices || []).length;
        el("stamp").textContent = n + (n === 1 ? " rental to bill" : " rentals to bill");
        el("err").hidden = true;
        render();
      })
      .catch(function (e) {
        el("stamp").textContent = "";
        fail("Could not load invoices: " + e.message);
      });
  }

  window.addEventListener("hashchange", openFromHash);
  window.addEventListener("tn-token-saved", function () { load(); });
  load().then(openFromHash);
})();
</script>
</body>
</html>
